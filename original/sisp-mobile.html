c1:{eleanor:['Doutora, como era o seu casamento com Arthur nos últimos meses?','[desvia o olhar] Trinta anos de casamento e de empresa. Nos últimos meses, só advogados. Ele queria separar o que era dele do que era meu, e eu me sentia traída por alguém que ajudei a construir. Mas jamais o machucaria, delegado.','Casamento em briga na justiça por bens; jura que jamais o machucaria'],

sofia:['Sofia, qual era a sua relação com Gaspar?','[cruza as pernas] Profissional. Entrevistei Gaspar três vezes em dez anos. Charmoso, mas sempre fugia das perguntas. Quando vieram as denúncias, ele prometeu me mostrar os livros. Eu acreditei.','Relação profissional; ele prometeu mostrar os livros'],
augusto:['Augusto, como era a convivência com o seu irmão?','[ri sem graça] Quinze anos de diferença e uma vida de comparação. Ele era o gênio, eu o "sócio". Vivia do dinheiro que ele adiantava, e ele me lembrava disso em todo jantar.','Vive de dinheiro adiantado pelo irmão; ressentido']},
c4:{olivia:['Qual era a sua relação com a equipe contratada para o baile?','[taça na mão] Eu pago, não frequento. A equipe veio por uma produtora. Sei o nome do DJ porque pedi uma valsa, e só.','Pouco contato com a equipe contratada'],
